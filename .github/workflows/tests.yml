# Runs the package's Tinytest suite with mtest across the supported Meteor releases

name: Test suite

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        meteorRelease:
          # Oldest supported releases (package.js versionsFrom), last 2.x and previous 3.x minor
          - '--release 2.8.2'
          - '--release 2.16'
          - '--release 3.0.4'
          - '--release 3.5.5'
          # Latest version
          -
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'

      - name: Install Dependencies
        run: |
          curl https://install.meteor.com | /bin/sh
          npm i -g @zodern/mtest

      - name: Run Tests
        run: |
          # Retry tests since some of them are flaky
          mtest --package ./ --once ${{ matrix.meteorRelease }} || mtest --package ./ --once ${{ matrix.meteorRelease }}
